<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heath18 Burn Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Layout: one narrow brutalist column — goal line, summary, plan calendar, settings */
  :root{
    --bg:#f2efe6; --card:#ffffff; --ink:#0a0a0a; --muted:#5b5b5b; --soft:#ece8dc;
    --cal:#0a0a0a; --calfg:#f2efe6; --calline:#3a3a3a;
    --yellow:#ffd23f; --pink:#ff8fd6; --blue:#4d7cff; --red:#ff4d2e; --green:#2fd07a; --onbright:#0a0a0a;
    --display:"Archivo Black",Impact,sans-serif; --body:"Space Grotesk",system-ui,sans-serif; --mono:"Space Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0e0e0e; --card:#171717; --ink:#f2efe6; --muted:#a3a3a3; --soft:#232323; --cal:#000000; --calline:#333333; color-scheme:dark }
  }
  :root[data-theme="dark"]{ --bg:#0e0e0e; --card:#171717; --ink:#f2efe6; --muted:#a3a3a3; --soft:#232323; --cal:#000000; --calline:#333333; color-scheme:dark }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
  header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:10px}
  h1{font:400 44px/.85 var(--display);margin:0;letter-spacing:-.03em;text-transform:uppercase}
  h1 span{background:var(--yellow);color:var(--onbright);padding:0 5px;border:3px solid var(--ink)}
  .tag{font:700 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;text-align:right}
  .box{background:var(--card);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}

  /* goal line */
  .goal{display:grid;grid-template-columns:1fr auto 1fr auto 1.5fr;align-items:center}
  .goal .f{position:relative;min-width:0}
  .goal input{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:400 22px var(--display);padding:12px 26px 12px 10px;outline:none;-webkit-appearance:none;border-radius:0}
  .goal input[type=date]{font:700 13px var(--mono);padding:14px 8px}
  .goal input:focus{background:var(--yellow);color:var(--onbright)}
  .goal .u{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:700 10px var(--mono);color:var(--muted);pointer-events:none}
  .goal .sep{font:700 12px var(--mono);padding:0 6px;align-self:stretch;display:grid;place-items:center;border-left:3px solid var(--ink);border-right:3px solid var(--ink);background:var(--soft)}
  .goal .cap{font:700 9px var(--mono);text-transform:uppercase;position:absolute;left:10px;top:4px;color:var(--muted);pointer-events:none}

  /* summary */
  .sum{padding:16px}
  .hero{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .big{font:400 44px/.9 var(--display);letter-spacing:-.03em}
  .big small{font:700 12px var(--mono);margin-left:4px;letter-spacing:0}
  .pill{font:700 11px var(--mono);text-transform:uppercase;padding:5px 8px;border:2px solid var(--ink);background:var(--green);color:var(--onbright);white-space:nowrap}
  .pill.warn{background:var(--red);color:#fff}
  .bar{height:16px;border:2px solid var(--ink);margin:14px 0 6px;background:repeating-linear-gradient(45deg,transparent 0 6px,var(--soft) 6px 12px)}
  .bar i{display:block;height:100%;background:var(--yellow);border-right:2px solid var(--ink)}
  .barl{display:flex;justify-content:space-between;font:700 10px var(--mono);text-transform:uppercase;gap:8px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);margin-top:14px}
  .stat{padding:10px;border-right:2px solid var(--ink)}
  .stat:last-child{border-right:0}
  .stat .k{font:700 10px var(--mono);text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .stat .v{font:400 28px var(--display);margin-top:2px}
  .sq{width:10px;height:10px;border:2px solid var(--ink);flex:none;display:inline-block}
  .note{font:700 11px var(--mono);margin-top:10px;text-transform:uppercase}

  /* calendar */
  .cal{background:var(--cal);color:var(--calfg);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--yellow);padding:16px}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .calhead h3{font:400 26px/1 var(--display);margin:0;text-transform:uppercase;letter-spacing:-.02em}
  .nav{display:flex;gap:6px}
  .nav button{width:36px;height:36px;border:2px solid var(--calfg);background:transparent;color:var(--calfg);font:700 18px var(--mono);cursor:pointer}
  .nav button:hover,.nav button:focus-visible{background:var(--yellow);color:var(--onbright);border-color:var(--yellow);outline:none}
  .wk,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .wk div{font:700 10px var(--mono);text-align:center;opacity:.55;padding-bottom:4px}
  .day{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;background:none;border:0;color:inherit;padding:0;font:inherit;min-width:0}
  .day .c{width:100%;max-width:46px;aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--calline);font:400 15px var(--display);position:relative}
  .day .c .n{position:absolute;top:1px;left:3px;font:700 9px var(--mono);opacity:.7}
  .day .c .dotx{width:5px;height:5px;background:var(--calline)}
  .day .v{font:700 10px var(--mono);opacity:.85;min-height:13px}
  .day.fast .c{background:var(--yellow);border-color:var(--yellow);color:var(--onbright)}
  .day.clean .c{background:var(--pink);border-color:var(--pink);color:var(--onbright)}
  .day.eaten .c{background:var(--calfg);border-color:var(--calfg);color:var(--onbright)}
  .day.pfast .c{border-color:var(--yellow);color:var(--yellow)}
  .day.pclean .c{border-color:var(--pink);color:var(--pink)}
  .day.miss .c{opacity:.45}
  .day.goalday .c{background:var(--blue);border-color:var(--blue);color:#fff}
  .day.after{opacity:.25}
  .day.today .c{outline:2px dashed var(--yellow);outline-offset:2px}
  .day.sel .c{outline:3px solid var(--blue);outline-offset:2px}
  .day.goalday.sel .c{outline-color:var(--calfg)}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font:700 9px var(--mono);text-transform:uppercase;margin-top:10px;opacity:.85}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;display:inline-block;border:2px solid transparent}

  .detail{margin-top:14px;border:2px solid var(--calfg);padding:12px}
  .dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .dh b{font:400 17px var(--display)}
  .dh span{font:700 11px var(--mono);text-transform:uppercase}
  .acts{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:6px;margin-top:10px}
  .acts button,.ate button{border:2px solid var(--calfg);background:transparent;color:var(--calfg);font:700 12px var(--mono);text-transform:uppercase;padding:10px 4px;cursor:pointer}
  .acts .bf:hover,.acts .bf:focus-visible{background:var(--yellow);color:var(--onbright);border-color:var(--yellow);outline:none}
  .acts .bc:hover,.acts .bc:focus-visible{background:var(--pink);color:var(--onbright);border-color:var(--pink);outline:none}
  .ate{display:flex}
  .ate input{width:100%;min-width:0;border:2px solid var(--calfg);border-right:0;background:transparent;color:var(--calfg);font:700 13px var(--mono);padding:8px;outline:none;border-radius:0}
  .ate input:focus{background:var(--calfg);color:var(--onbright)}
  .ate button{flex:none;padding:10px 8px}
  .ate button:hover,.ate button:focus-visible{background:var(--calfg);color:var(--onbright);outline:none}
  .wchk{display:flex;align-items:center;gap:8px;font:700 11px var(--mono);text-transform:uppercase;margin-top:10px;cursor:pointer}
  .wchk input{accent-color:var(--blue);width:16px;height:16px}
  .ents{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .ent{display:flex;justify-content:space-between;align-items:center;font:700 12px var(--mono);text-transform:uppercase;border-top:1px dashed var(--calline);padding-top:6px}
  .ent button{border:2px solid var(--calfg);background:none;color:var(--calfg);width:24px;height:24px;font:700 12px var(--mono);cursor:pointer}
  .ent button:hover{background:var(--red);border-color:var(--red)}
  .calfoot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:10px;border-top:2px dashed var(--calline);font:700 11px var(--mono);text-transform:uppercase}
  .calfoot b{color:var(--yellow)}

  /* settings */
  details.box{padding:0}
  summary{list-style:none;cursor:pointer;padding:14px 16px;font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between}
  summary::-webkit-details-marker{display:none}
  summary:after{content:"+";font-size:16px}
  details[open] summary:after{content:"−"}
  details[open] summary{border-bottom:3px solid var(--ink)}
  .set{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .set .full{grid-column:1/-1}
  label.l{display:block;font:700 10px var(--mono);text-transform:uppercase;margin-bottom:5px}
  .fld{position:relative}
  .set input[type=number]{width:100%;padding:9px 40px 9px 10px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:700 15px var(--body);outline:none;border-radius:0}
  .set input:focus{background:var(--yellow);color:var(--onbright)}
  .fld .u{position:absolute;right:8px;bottom:11px;font:700 10px var(--mono);color:var(--muted);pointer-events:none}
  .rh{display:flex;justify-content:space-between;align-items:center}
  .rh b{font:400 18px var(--display);background:var(--pink);color:var(--onbright);border:2px solid var(--ink);padding:0 7px}
  input[type=range]{width:100%;accent-color:var(--ink)}
  .tg{display:flex;align-items:center;justify-content:space-between;border:2px solid var(--ink);padding:9px 10px;cursor:pointer;font-weight:700}
  .tg input{accent-color:var(--blue);width:18px;height:18px}
  .per{font:700 10px var(--mono);text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
  .per b{color:var(--ink)}
  @media (max-width:380px){ .goal input{font-size:18px} h1{font-size:36px} .big{font-size:36px} }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Heath<span>18</span></h1>
    <div class="tag">1 kg = 7,700 kcal</div>
  </header>

  <!-- one-line goal -->
  <div class="box goal">
    <div class="f"><span class="cap">Now</span><input id="w0" type="number" step="0.1" value="80" inputmode="decimal" aria-label="Current weight"><span class="u">KG</span></div>
    <div class="sep">→</div>
    <div class="f"><span class="cap">Goal</span><input id="w1" type="number" step="0.1" value="72" inputmode="decimal" aria-label="Target weight"><span class="u">KG</span></div>
    <div class="sep">BY</div>
    <div class="f"><input id="date" type="date" aria-label="Target date"></div>
  </div>

  <!-- summary -->
  <div class="box sum">
    <div class="hero">
      <div class="big" id="total">0<small>KCAL</small></div>
      <span class="pill" id="status">On track</span>
    </div>
    <div class="bar"><i id="barDone"></i></div>
    <div class="barl"><span id="doneLbl"></span><span id="leftLbl"></span></div>
    <div class="stats">
      <div class="stat"><div class="k">Days</div><div class="v" id="days">0</div></div>
      <div class="stat"><div class="k"><span class="sq" style="background:var(--yellow)"></span>Fasts</div><div class="v" id="nFast">0</div></div>
      <div class="stat"><div class="k"><span class="sq" style="background:var(--pink)"></span>Clean</div><div class="v" id="nClean">0</div></div>
    </div>
    <div class="note" id="note"></div>
  </div>

  <!-- plan + history calendar -->
  <div class="cal">
    <div class="calhead">
      <h3 id="calTitle">Month</h3>
      <div class="nav"><button id="prev" aria-label="Previous month">‹</button><button id="next" aria-label="Next month">›</button></div>
    </div>
    <div class="wk"><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div></div>
    <div class="days" id="grid"></div>
    <div class="legend">
      <span><i style="border-color:var(--yellow)"></i>Fast</span>
      <span><i style="border-color:var(--pink)"></i>Clean</span>
      <span><i style="background:var(--yellow)"></i>Done</span>
      <span><i style="background:var(--blue)"></i>Goal</span>
      <span>🔥 Hit</span>
    </div>
    <div class="detail" id="detail">
      <div class="dh"><b id="dTitle"></b><span id="dPlan"></span></div>
      <div id="dLog">
        <div class="acts">
          <button class="bf" data-t="fast">Fast</button>
          <button class="bc" data-t="clean">Clean</button>
          <div class="ate"><input id="eaten" type="number" step="50" placeholder="kcal" inputmode="numeric" aria-label="Calories eaten"><button data-t="eaten">Ate</button></div>
        </div>
        <label class="wchk"><input id="lw" type="checkbox" checked> Water before meals</label>
      </div>
      <div class="ents" id="ents"></div>
    </div>
    <div class="calfoot">
      <span>🔥 <b id="litN">0</b> of <span id="monthN">0</span> days · best <b id="best">0</b></span>
      <span>Week <b id="wkN">0</b> 🔥</span>
    </div>
  </div>

  <!-- settings -->
  <details class="box">
    <summary>Settings</summary>
    <div class="set">
      <div class="fld"><label class="l" for="tdee">Daily burn</label><input id="tdee" type="number" step="10"><span class="u">KCAL</span></div>
      <div class="fld"><label class="l" for="clean">Clean deficit</label><input id="clean" type="number" step="50" value="500"><span class="u">KCAL</span></div>
      <div class="full"><div class="rh"><label class="l" for="fpw">Fasts / week</label><b id="fpwv">2</b></div><input id="fpw" type="range" min="0" max="7" value="2"></div>
      <label class="tg"><span>Water first <span style="font:700 10px var(--mono);color:var(--muted)">−80/MEAL</span></span><input id="water" type="checkbox" checked></label>
      <div class="fld"><label class="l" for="meals">Meals / day</label><input id="meals" type="number" min="1" max="6" value="2"><span class="u">MEALS</span></div>
      <div class="per full" id="per"></div>
    </div>
  </details>
</div>

<script>
const KCAL_PER_KG = 7700, WATER_PER_MEAL = 80;
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString();
const iso = d => { const z = new Date(d); z.setMinutes(z.getMinutes() - z.getTimezoneOffset()); return z.toISOString().slice(0,10) };
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d) };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d) };
const today = () => iso(new Date());
const short = n => n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,'') + 'k' : String(Math.round(n));
const store = {
  get(k,d){ try{ const v = localStorage.getItem('h18_'+k); return v ? JSON.parse(v) : d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem('h18_'+k, JSON.stringify(v)) }catch(e){} }
};

const fields = ['w0','w1','date','tdee','fpw','clean','water','meals'];
let log = store.get('log', []);
let view = parse(today()); view.setDate(1);
let sel = today();

const saved = store.get('cfg', null);
if (saved) fields.forEach(f => { if (saved[f] !== undefined) $(f).type === 'checkbox' ? $(f).checked = saved[f] : $(f).value = saved[f] });
if (!$('date').value) $('date').value = addDays(today(), 90);
if (!$('tdee').value) $('tdee').value = Math.round(+$('w0').value * 28 / 10) * 10;

const cfg = () => { const c = {}; fields.forEach(f => c[f] = $(f).type === 'checkbox' ? $(f).checked : $(f).value); return c };
const waterBonus = c => c.water ? WATER_PER_MEAL * (+c.meals || 0) : 0;
function deficitOf(e, c){
  const w = e.water ? WATER_PER_MEAL * (+c.meals || 0) : 0;
  if (e.type === 'fast') return +c.tdee || 0;
  if (e.type === 'clean') return (+c.clean || 0) + w;
  return Math.max(0, (+c.tdee || 0) - (+e.eaten || 0)) + w;
}
function byDay(c){
  const m = {};
  log.forEach(e => { const d = m[e.date] || (m[e.date] = { kcal:0, types:new Set(), items:[] }); d.kcal += deficitOf(e,c); d.types.add(e.type); d.items.push(e) });
  return m;
}
const mainType = t => t.has('fast') ? 'fast' : t.has('clean') ? 'clean' : 'eaten';
const spread = (n, k) => { const s = new Set(); for (let i = 0; i < k; i++) s.add(Math.floor((i + .5) * n / k)); return s };

// Build the plan: which upcoming days are fasts and clean days
function buildPlan(c, days, left){
  const t = today(), list = [];
  for (let d = t; d < c.date; d = addDays(d, 1)) if (!days[d]) list.push(d);
  const n = list.length, vFast = +c.tdee || 0, vClean = (+c.clean || 0) + waterBonus(c);
  const scheduled = Math.min(n, Math.round(n * c.fpw / 7));
  const F = Math.min(scheduled, vFast ? Math.ceil(left / vFast) : 0);
  const need = vClean > 0 ? Math.ceil(Math.max(0, left - F * vFast) / vClean) : Infinity;
  const C = Math.min(n - F, need);
  const fi = spread(n, F), rest = list.filter((_, i) => !fi.has(i)), ci = spread(rest.length, C);
  const plan = {};
  list.forEach((d, i) => { if (fi.has(i)) plan[d] = 'fast' });
  rest.forEach((d, i) => { if (ci.has(i)) plan[d] = 'clean' });
  return { plan, n, F, C, need, scheduled, ok: need <= n - F, vFast, vClean };
}

function render(){
  const c = cfg(); store.set('cfg', c);
  $('fpwv').textContent = c.fpw;
  const days = byDay(c), t = today();
  const total = Math.max(0, (+c.w0) - (+c.w1)) * KCAL_PER_KG;
  const done = Object.values(days).reduce((s,d) => s + d.kcal, 0);
  const left = Math.max(0, total - done);
  const P = buildPlan(c, days, left);
  const lit = d => days[d] && days[d].kcal >= P.vClean;

  // summary
  $('total').innerHTML = fmt(left) + '<small>KCAL LEFT</small>';
  $('barDone').style.width = total ? Math.min(100, done/total*100) + '%' : '0';
  $('doneLbl').textContent = fmt(done) + ' burned · ' + (done/KCAL_PER_KG).toFixed(1) + ' kg';
  $('leftLbl').textContent = 'of ' + fmt(total) + ' · ' + (total/KCAL_PER_KG).toFixed(1) + ' kg';
  $('days').textContent = P.n;
  $('nFast').textContent = P.F;
  $('nClean').textContent = P.C;
  const st = $('status'), note = $('note');
  if (left === 0){ st.textContent = 'Goal reached'; st.className = 'pill'; note.textContent = '' }
  else if (P.ok){ st.textContent = 'On track'; st.className = 'pill'; const sp = P.n - P.F - P.C; note.textContent = sp > 0 ? '→ ' + sp + ' free days' : '→ Every day counts' }
  else {
    st.textContent = 'Not reachable'; st.className = 'pill warn';
    const minF = P.vFast > P.vClean ? Math.ceil((left - P.n * P.vClean) / (P.vFast - P.vClean)) : Infinity;
    note.textContent = isFinite(minF) && minF <= P.n ? '→ Need ' + minF + ' fasts (' + (minF / P.n * 7).toFixed(1) + '/week) or a later date' : '→ Pick a later date';
  }
  $('per').innerHTML = `<span>1 fast <b>${fmt(P.vFast)}</b></span><span>1 clean day <b>${fmt(P.vClean)}</b></span><span>Fasts / kg <b>${P.vFast ? (KCAL_PER_KG/P.vFast).toFixed(1) : '—'}</b></span>`;

  // calendar
  const y = view.getFullYear(), mo = view.getMonth(), nDays = new Date(y,mo+1,0).getDate();
  $('calTitle').textContent = view.toLocaleDateString(undefined,{month:'short',year:'numeric'});
  let html = '';
  for (let i = 0, f = (new Date(y,mo,1).getDay()+6)%7; i < f; i++) html += '<div></div>';
  for (let d = 1; d <= nDays; d++){
    const k = iso(new Date(y,mo,d)), info = days[k], p = P.plan[k], cls = ['day'];
    let inner = '<span class="dotx"></span>', val = '';
    if (info){ cls.push(mainType(info.types)); inner = lit(k) ? '🔥' : ''; val = '−' + short(info.kcal) }
    else if (k === c.date){ cls.push('goalday'); inner = '🏁'; val = 'GOAL' }
    else if (p){ cls.push(p === 'fast' ? 'pfast' : 'pclean'); inner = p === 'fast' ? 'F' : 'C' }
    else if (k < t){ cls.push('miss'); val = '0' }
    else if (k > c.date) cls.push('after');
    if (k === t) cls.push('today');
    if (k === sel) cls.push('sel');
    html += `<button class="${cls.join(' ')}" data-d="${k}"><span class="c"><span class="n">${d}</span>${inner}</span><span class="v">${val}</span></button>`;
  }
  $('grid').innerHTML = html;

  // selected day
  const s = days[sel], future = sel > t;
  $('dTitle').textContent = parse(sel).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
  $('dPlan').textContent = s ? '−' + fmt(s.kcal) + ' kcal' + (lit(sel) ? ' 🔥' : '')
    : sel === c.date ? 'Goal day' : P.plan[sel] === 'fast' ? 'Plan: fast' : P.plan[sel] === 'clean' ? 'Plan: clean' : future ? 'Free' : 'Nothing logged';
  $('dLog').hidden = future;
  const names = { fast:'Fast', clean:'Clean', eaten:'Ate' };
  $('ents').innerHTML = (s ? s.items : []).map(e => `<div class="ent"><span>${names[e.type]}${e.type==='eaten' ? ' ' + fmt(e.eaten) : ''}${e.water && e.type!=='fast' ? ' · water' : ''} · −${fmt(deficitOf(e,c))}</span><button data-id="${e.id}" aria-label="Remove">×</button></div>`).join('');

  // footer
  const m0 = iso(new Date(y,mo,1)), m1 = iso(new Date(y,mo,nDays));
  $('monthN').textContent = m0 > t ? 0 : m1 <= t ? nDays : parse(t).getDate();
  let ln = 0; for (let d = 1; d <= nDays; d++) if (lit(iso(new Date(y,mo,d)))) ln++;
  $('litN').textContent = ln;
  let best = 0, run = 0, prev = null;
  Object.keys(days).filter(lit).sort().forEach(k => { run = prev && addDays(prev,1) === k ? run + 1 : 1; best = Math.max(best, run); prev = k });
  $('best').textContent = best;
  const mon = addDays(t, -((parse(t).getDay()+6)%7));
  let wk = 0; for (let i = 0; i < 7; i++) if (lit(addDays(mon, i))) wk++;
  $('wkN').textContent = wk;
}

fields.forEach(f => $(f).addEventListener('input', render));
$('water').addEventListener('change', render);
$('grid').addEventListener('click', ev => { const b = ev.target.closest('.day'); if (!b) return; sel = b.dataset.d; render() });
$('detail').addEventListener('click', ev => {
  const rm = ev.target.closest('.ent button');
  if (rm){ log = log.filter(e => e.id !== +rm.dataset.id); store.set('log', log); render(); return }
  const b = ev.target.closest('button[data-t]'); if (!b) return;
  const type = b.dataset.t;
  if (type === 'eaten' && !$('eaten').value){ $('eaten').focus(); return }
  log.push({ id: Date.now(), date: sel, type, eaten: type === 'eaten' ? +$('eaten').value : 0, water: type !== 'fast' && $('lw').checked });
  store.set('log', log); $('eaten').value = ''; render();
});
$('prev').addEventListener('click', () => { view.setMonth(view.getMonth() - 1); render() });
$('next').addEventListener('click', () => { view.setMonth(view.getMonth() + 1); render() });
render();
</script>
</body>
</html>
